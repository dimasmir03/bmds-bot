[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmds-bot"
version = "0.1.0"
description = "Async Telegram image editing backend with pluggable providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "pillow-heif>=0.18,<2",
  "pydantic-settings>=2.5,<3",
  "redis>=5.1,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]
# Local FLUX.2 klein inference (worker image only). Flux2KleinPipeline appeared in diffusers 0.37.
model = [
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.45,<1",
  "diffusers>=0.37,<1",
  "safetensors>=0.4,<1",
  "torch>=2.6,<3",
  "transformers>=4.51,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

