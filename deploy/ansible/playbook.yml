---
- name: Deploy BMDS bot
  hosts: bmds
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Install Docker and Git
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Checkout application
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        update: true
      notify: Restart application

    - name: Render environment file
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      notify: Restart application

    - name: Start application
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: present

  handlers:
    - name: Restart application
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: restarted
